name: Release (Developer ID + Sparkle)

# Pushing a v* tag builds, signs with Developer ID, notarizes/staples, packages ZIP/DMG,
# signs Sparkle updates, generates appcast, creates a GitHub Release, and publishes the feed to GitHub Pages.
# Direct distribution only; Mac App Store distribution uses a separate process.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # Create releases and push the gh-pages branch.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15   # Apple Silicon (arm64), matching the project architecture.
    env:
      SPARKLE_VERSION: "2.9.3"
      TEAM_ID: D5KUMJQ7T8
      NOTARY_PROFILE: serverdesk-notary
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XC=$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort --version-sort | tail -1)
          if [ -z "$XC" ]; then
            XC=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' ! -iname '*beta*' | sort --version-sort | tail -1)
          fi
          [ -n "$XC" ] || { echo "::error::No usable Xcode installation found."; exit 1; }
          echo "Selected Xcode: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          # Pass the selected Xcode to later steps, including package-app.sh.
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Validate required secrets
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_APP_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is not configured."
              exit 1
            fi
          done

      - name: Install build tools
        run: brew install xcodegen create-dmg

      # A placeholder Sparkle public key cannot verify update signatures.
      - name: Validate Sparkle public key
        run: |
          if grep -q "__SPARKLE_PUBLIC_ED_KEY_PLACEHOLDER__" ServerDock/Info.plist; then
            echo "::error::SUPublicEDKey in ServerDock/Info.plist is a placeholder. Generate keys with generate_keys and set the public key."
            exit 1
          fi
          FEED_URL=$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' ServerDock/Info.plist)
          OWNER=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          EXPECTED_FEED="https://$OWNER.github.io/$REPO/appcast.xml"
          if [ "$FEED_URL" != "$EXPECTED_FEED" ]; then
            echo "::error::Set SUFeedURL to this repository's feed URL: $EXPECTED_FEED"
            exit 1
          fi

      # Import the Developer ID Application certificate into a temporary keychain.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Add the keychain to the search list for codesign and find-identity.
          security list-keychains -d user -s "$KEYCHAIN"
          # Mask developer/team details that may appear in later logs.
          DEVID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o 'Developer ID Application: [^"]*' | head -1 || true)
          [ -n "$DEVID" ] || { echo "::error::Developer ID Application certificate not found."; exit 1; }
          echo "::add-mask::$DEVID"
          echo "::add-mask::${DEVID#Developer ID Application: }"
          echo "Signing certificate imported."
          rm -f "$RUNNER_TEMP/cert.p12"

      # Create the notarytool keychain profile used by package-app.sh.
      - name: Configure notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Generate Xcode project
        run: xcodegen generate

      # Use the packaging script for archiving, signing, notarization, and DMG creation.
      - name: Sign and notarize app, then create DMG
        run: NOTARY_PROFILE=$NOTARY_PROFILE ./scripts/package-app.sh

      - name: Verify artifacts and version
        id: artifacts
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 2 -name 'ServerDock.app' | head -1)
          DMG=$(find dist -maxdepth 2 -name '*.dmg' | head -1)
          [ -d "$APP" ] || { echo "::error::ServerDock.app not found."; exit 1; }
          [ -f "$DMG" ] || { echo "::error::DMG not found."; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "${GITHUB_REF_NAME}" = "v$VERSION" ] || { echo "::error::Tag ${GITHUB_REF_NAME} does not match app version $VERSION."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=2 "$APP"
          echo "app=$APP"   >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Download Sparkle tools for appcast generation.
      - name: Download Sparkle distribution tools
        run: |
          set -euo pipefail
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p .sparkle && tar -xJf sparkle.tar.xz -C .sparkle bin

      # Collect the update ZIP, existing appcast, and release notes in one directory.
      - name: Prepare Sparkle update files
        id: sparkle
        run: |
          set -euo pipefail
          VERSION="${{ steps.artifacts.outputs.version }}"
          ARCH_DIR="$RUNNER_TEMP/sparkle-archives"
          mkdir -p "$ARCH_DIR"
          # 1) Include the top-level .app in the Sparkle update ZIP.
          ditto -c -k --keepParent "${{ steps.artifacts.outputs.app }}" "$ARCH_DIR/ServerDock-$VERSION.zip"
          # 2) Preserve the existing appcast; use the repository seed feed on a first-release 404.
          FEED_URL=$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' ServerDock/Info.plist)
          HTTP_STATUS=$(curl -sSL -o "$ARCH_DIR/appcast.xml" -w '%{http_code}' "$FEED_URL")
          case "$HTTP_STATUS" in
            200) ;;
            404) cp appcast.xml "$ARCH_DIR/appcast.xml" ;;
            *) echo "::error::Failed to download existing appcast (HTTP $HTTP_STATUS): $FEED_URL"; exit 1 ;;
          esac
          # 3) Use tag notes, falling back to the commit message, for update descriptions.
          NOTES=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          [ -n "$NOTES" ] || NOTES=$(git log -1 --pretty=%B "${{ github.ref_name }}")
          {
            echo "<h2>ServerDock $VERSION</h2>"
            printf '%s\n' "$NOTES" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/$/<br>/'
          } > "$ARCH_DIR/ServerDock-$VERSION.html"
          # 4) Reuse the description for the GitHub Release body.
          { echo "### What's New"; echo; printf '%s\n' "$NOTES" | sed 's/^/- /'; } > "$RUNNER_TEMP/release-body.md"
          echo "dir=$ARCH_DIR" >> "$GITHUB_OUTPUT"

      # Generate an EdDSA-signed appcast pointing to this repository's GitHub Release ZIP.
      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PREFIX="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | .sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "$PREFIX" \
            --link "https://github.com/${{ github.repository }}" \
            --maximum-versions 0 \
            "${{ steps.sparkle.outputs.dir }}"
          echo "appcast.xml generated"

      # Attach the verified signed/notarized ZIP and DMG to the GitHub Release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ServerDock ${{ steps.artifacts.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            ${{ steps.sparkle.outputs.dir }}/ServerDock-${{ steps.artifacts.outputs.version }}.zip
            ${{ steps.artifacts.outputs.dmg }}
          generate_release_notes: true

      # Publish appcast to this repository's gh-pages branch.
      # Ensure the published feed URL matches SUFeedURL in Info.plist.
      - name: Publish appcast to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.sparkle.outputs.dir }}
          keep_files: true   # Preserve existing Pages files.
          exclude_assets: "*.zip,*.app"   # Publish update ZIPs in GitHub Releases.
